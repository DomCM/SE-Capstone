<style>
    .camera-settings-overlay { position: fixed; inset: 0; z-index: 1200; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(8, 15, 32, .72); }
    .camera-settings-overlay.is-open { display: flex; }
    .camera-settings-dialog { width: min(680px, 100%); max-height: 90vh; overflow-y: auto; padding: 24px; border-radius: 14px; background: #fff; color: #172033; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
    .camera-settings-dialog h2 { margin: 0 0 6px; }
    .camera-settings-dialog p { margin: 0 0 18px; color: #64748b; }
    .camera-settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .camera-settings-field { display: flex; flex-direction: column; gap: 6px; }
    .camera-settings-field.full { grid-column: 1 / -1; }
    .camera-settings-field label { font-size: 13px; font-weight: 600; }
    .camera-settings-field input, .camera-settings-field select { min-height: 40px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 7px; background: #fff; color: #172033; }
    .camera-settings-toggle { display: flex; align-items: center; gap: 9px; padding: 10px 0; }
    .camera-settings-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .camera-settings-actions button { padding: 9px 14px; border: 0; border-radius: 7px; cursor: pointer; }
    .camera-settings-save { background: #1d4ed8; color: #fff; }
    .camera-settings-cancel { background: #e2e8f0; color: #172033; }
    @media (max-width: 560px) { .camera-settings-grid { grid-template-columns: 1fr; } }
</style>
<div class="camera-settings-overlay" id="cameraSettingsOverlay" role="dialog" aria-modal="true" aria-labelledby="cameraSettingsTitle">
    <form class="camera-settings-dialog" id="cameraSettingsForm">
        <h2 id="cameraSettingsTitle">Camera settings</h2>
        <p>Camera-level options override account defaults. “Inherit” keeps the account setting in effect.</p>
        <div class="camera-settings-grid">
            <div class="camera-settings-field">
                <label for="cameraSettingsName">Camera name</label>
                <input id="cameraSettingsName" name="name" maxlength="100" required>
            </div>
            <div class="camera-settings-field">
                <label for="cameraSettingsZone">Zone / location</label>
                <input id="cameraSettingsZone" name="zone" maxlength="100" required>
            </div>
            <div class="camera-settings-field full">
                <label for="cameraSettingsSource">RTSP / HTTP stream URL</label>
                <input id="cameraSettingsSource" name="source" maxlength="500" required autocomplete="off">
            </div>
            <label class="camera-settings-toggle full">
                <input id="cameraSettingsProcessing" name="cv_processing_enabled" type="checkbox">
                Process this camera through computer vision
            </label>
            <div class="camera-settings-field">
                <label for="cameraSettingsFire">Fire detection</label>
                <select id="cameraSettingsFire" name="fire_detection_enabled">
                    <option value="">Inherit account setting</option><option value="true">Enabled</option><option value="false">Disabled</option>
                </select>
            </div>
            <div class="camera-settings-field">
                <label for="cameraSettingsSmoke">Smoke detection</label>
                <select id="cameraSettingsSmoke" name="smoke_detection_enabled">
                    <option value="">Inherit account setting</option><option value="true">Enabled</option><option value="false">Disabled</option>
                </select>
            </div>
            <div class="camera-settings-field">
                <label for="cameraSettingsFace">Facial recognition</label>
                <select id="cameraSettingsFace" name="face_recognition_enabled">
                    <option value="">Inherit account setting</option><option value="true">Enabled</option><option value="false">Disabled</option>
                </select>
            </div>
            <div class="camera-settings-field">
                <label for="cameraSettingsEmail">Fire / smoke email alerts</label>
                <select id="cameraSettingsEmail" name="email_alerts_enabled">
                    <option value="">Inherit account setting</option><option value="true">Enabled</option><option value="false">Disabled</option>
                </select>
            </div>
            <div class="camera-settings-field">
                <label for="cameraSettingsUnidentifiedEmail">Unidentified-face email alerts</label>
                <select id="cameraSettingsUnidentifiedEmail" name="unidentified_email_alerts_enabled">
                    <option value="">Inherit account setting</option><option value="true">Enabled</option><option value="false">Disabled</option>
                </select>
            </div>
        </div>
        <p id="cameraSettingsMessage" role="status" style="margin:14px 0 0;"></p>
        <div class="camera-settings-actions">
            <button type="button" class="camera-settings-cancel" onclick="closeCameraSettings()">Cancel</button>
            <button type="submit" class="camera-settings-save">Save camera settings</button>
        </div>
    </form>
</div>
<script>
    let cameraSettingsId = null;
    const cameraSettingsOverlay = document.getElementById('cameraSettingsOverlay');
    const cameraSettingsForm = document.getElementById('cameraSettingsForm');
    const cameraSettingsFields = {
        fire_detection_enabled: 'cameraSettingsFire',
        smoke_detection_enabled: 'cameraSettingsSmoke',
        face_recognition_enabled: 'cameraSettingsFace',
        email_alerts_enabled: 'cameraSettingsEmail',
        unidentified_email_alerts_enabled: 'cameraSettingsUnidentifiedEmail'
    };

    async function openCameraSettings(cameraId) {
        cameraSettingsId = cameraId;
        const message = document.getElementById('cameraSettingsMessage');
        message.textContent = 'Loading camera settings…';
        cameraSettingsOverlay.classList.add('is-open');
        try {
            const response = await fetch(`/api/camera/${cameraId}/settings`, { cache: 'no-store' });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Unable to load camera settings.');
            document.getElementById('cameraSettingsName').value = data.name;
            document.getElementById('cameraSettingsZone').value = data.zone;
            document.getElementById('cameraSettingsSource').value = data.source;
            document.getElementById('cameraSettingsProcessing').checked = data.overrides.cv_processing_enabled;
            for (const [key, id] of Object.entries(cameraSettingsFields)) {
                document.getElementById(id).value =
                    data.overrides[key] === null ? '' : String(data.overrides[key]);
            }
            message.textContent = '';
        } catch (error) {
            message.textContent = error.message;
        }
    }

    function closeCameraSettings() {
        cameraSettingsOverlay.classList.remove('is-open');
        cameraSettingsId = null;
    }

    cameraSettingsOverlay.addEventListener('click', event => {
        if (event.target === cameraSettingsOverlay) closeCameraSettings();
    });
    cameraSettingsForm.addEventListener('submit', async event => {
        event.preventDefault();
        if (!cameraSettingsId) return;
        const form = new FormData(cameraSettingsForm);
        const payload = {
            name: form.get('name'),
            zone: form.get('zone'),
            source: form.get('source'),
            cv_processing_enabled: document.getElementById('cameraSettingsProcessing').checked
        };
        for (const key of Object.keys(cameraSettingsFields)) {
            const value = form.get(key);
            payload[key] = value === '' ? null : value === 'true';
        }
        const saveButton = cameraSettingsForm.querySelector('.camera-settings-save');
        const message = document.getElementById('cameraSettingsMessage');
        saveButton.disabled = true;
        message.textContent = 'Saving…';
        try {
            const response = await fetch(`/api/camera/${cameraSettingsId}/settings`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Unable to save camera settings.');
            message.textContent = data.message;
            window.location.reload();
        } catch (error) {
            message.textContent = error.message;
        } finally {
            saveButton.disabled = false;
        }
    });
</script>
