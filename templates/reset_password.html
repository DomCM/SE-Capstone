<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Home Detection Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy-950:  #050b1a; --navy-900:  #0b1735; --navy-800:  #0d1b3e;
            --navy-600:  #1e3170; --navy-400:  #4a6db5; --navy-100:  #dce4f5;
            --white:     #ffffff; --off-white: #f7f8fc; --border:    #e2e8f5;
            --text-dark: #0b1735; --text-mid:  #3a4d70; --text-muted:#7a8fba;
            --emerald-500: #10b981; --danger: #c0392b;
        }

        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; background: var(--white); }

        .left-panel {
            width: 55%; background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-900) 100%);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 48px 56px; overflow: hidden;
        }

        .left-brand { display: flex; align-items: center; gap: 12px; position: relative; z-index: 2; }
        .left-logo-box { width: 44px; height: 44px; background: #ffffff; border-radius: 12px; padding: 3px; display: flex; align-items: center; justify-content: center;}
        .left-logo-box img { width: 100%; height: 100%; object-fit: contain; }
        .left-brand-name { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.95); }
        .left-brand-sub { font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.4); text-transform: uppercase; }

        .left-hero { position: relative; z-index: 2; animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .left-headline { font-family: 'Playfair Display', Georgia, serif; font-size: 48px; font-weight: 700; color: var(--white); margin-bottom: 20px; }

        .right-panel { width: 45%; display: flex; align-items: center; justify-content: center; padding: 48px 56px; }
        .right-inner { width: 100%; max-width: 360px; animation: fadeInRight 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .right-greeting { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--navy-400); margin-bottom: 10px; }
        .right-title { font-family: 'Playfair Display', Georgia, serif; font-size: 30px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        .right-subtitle { font-size: 13.5px; color: var(--text-muted); margin-bottom: 24px; }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-mid); margin-bottom: 7px; }
        .field-wrap { position: relative; }
        .field-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted); }
        
        .toggle-password {
            position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
            width: 18px; height: 18px; color: var(--text-muted); cursor: pointer;
            transition: color 0.15s; background: none; border: none; padding: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .toggle-password:hover { color: var(--navy-800); }

        .field input {
            width: 100%; background: var(--off-white); border: 1.5px solid var(--border);
            border-radius: 8px; padding: 11px 40px 11px 40px; font-size: 13.5px; outline: none;
            transition: all 0.15s;
        }
        .field input:focus { border-color: var(--navy-600); background: var(--white); box-shadow: 0 0 0 3px var(--navy-100); }

        /* Security Requirements Checklist */
        .req-list {
            background: var(--off-white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .req-item {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.15s;
        }

        .req-item svg { width: 14px; height: 14px; flex-shrink: 0; }
        .req-item.valid { color: var(--emerald-500); font-weight: 500; }
        .req-item.valid svg { color: var(--emerald-500); }

        .btn-submit {
            width: 100%; background: var(--navy-800); color: var(--white); border: none;
            padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background 0.15s;
        }
        .btn-submit:hover { background: var(--navy-950); }

        @media (max-width: 840px) { .left-panel { display: none; } .right-panel { width: 100%; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="left-brand">
            <div class="left-logo-box">
                <img src="{{ url_for('static', filename='eblogo.jpg') }}" alt="HDS Logo">
            </div>
            <div>
                <div class="left-brand-name">Home Detection Security</div>
                <div class="left-brand-sub">Monitoring System</div>
            </div>
        </div>
        <div class="left-hero">
            <h1 class="left-headline">Create new<br><em>password.</em></h1>
        </div>
        <div></div>
    </div>

    <div class="right-panel">
        <div class="right-inner">
            <p class="right-greeting">Security Update</p>
            <h2 class="right-title">Set New Password</h2>
            <p class="right-subtitle">Ensure your account is using a strong password.</p>

            <form action="{{ url_for('reset_password') }}" method="POST" id="reset-form">
                <div class="field">
                    <label for="password">New Password</label>
                    <div class="field-wrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" data-target="password">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Password Requirements List -->
                <div class="req-list">
                    <div class="req-item" id="req-length">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
                        At least 8 characters long
                    </div>
                    <div class="req-item" id="req-upper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
                        At least 1 uppercase letter (A-Z)
                    </div>
                    <div class="req-item" id="req-number">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
                        At least 1 number (0-9)
                    </div>
                    <div class="req-item" id="req-special">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
                        At least 1 special character (!@#$%^&*)
                    </div>
                </div>

                <div class="field">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="field-wrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" data-target="confirm_password">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Reset Password</button>
            </form>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm_password');
        const form = document.getElementById('reset-form');

        // Toggle Password Visibility (Eye Icon) Logic
        const toggleButtons = document.querySelectorAll('.toggle-password');

        const eyeOpenSVG = `<svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        const eyeClosedSVG = `<svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

        toggleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-target');
                const targetInput = document.getElementById(targetId);

                if (targetInput.type === 'password') {
                    targetInput.type = 'text';
                    btn.innerHTML = eyeClosedSVG;
                } else {
                    targetInput.type = 'password';
                    btn.innerHTML = eyeOpenSVG;
                }
            });
        });

        // Requirement Elements
        const reqLength = document.getElementById('req-length');
        const reqUpper = document.getElementById('req-upper');
        const reqNumber = document.getElementById('req-number');
        const reqSpecial = document.getElementById('req-special');

        const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
        const circleIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>`;

        function updateReq(element, isValid) {
            if (isValid) {
                element.classList.add('valid');
                element.querySelector('svg').outerHTML = checkIcon;
            } else {
                element.classList.remove('valid');
                element.querySelector('svg').outerHTML = circleIcon;
            }
        }

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;

            // Validation Checks
            const isLength = val.length >= 8;
            const isUpper = /[A-Z]/.test(val);
            const isNumber = /[0-9]/.test(val);
            const isSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(val);

            updateReq(reqLength, isLength);
            updateReq(reqUpper, isUpper);
            updateReq(reqNumber, isNumber);
            updateReq(reqSpecial, isSpecial);
        });

        // Form Submit Validation
        form.addEventListener('submit', (e) => {
            const val = passwordInput.value;
            const isLength = val.length >= 8;
            const isUpper = /[A-Z]/.test(val);
            const isNumber = /[0-9]/.test(val);
            const isSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(val);

            if (!isLength || !isUpper || !isNumber || !isSpecial) {
                e.preventDefault();
                alert('Please meet all password strength requirements before proceeding.');
                return;
            }

            if (passwordInput.value !== confirmInput.value) {
                e.preventDefault();
                alert('Passwords do not match!');
            }
        });
    </script>

</body>
</html>
