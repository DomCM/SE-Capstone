<style>
    .flash-toast-container {
        position: fixed;
        top: 84px;
        right: 24px;
        z-index: 1100;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(360px, calc(100vw - 48px));
    }
    .flash-toast {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 10px;
        background: #0b1735;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 8px 24px rgba(11,23,53,0.16);
        font: 500 12.5px/1.5 Inter, sans-serif;
        animation: flash-toast-in 0.25s ease-out;
    }
    .flash-toast-danger { background: #6b1d1d; border-color: #9c2e2e; }
    .flash-toast-success { background: #114b34; border-color: #1c714f; }
    @keyframes flash-toast-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
</style>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-toast-container" id="flashToastContainer" role="status" aria-live="polite">
        {% for category, message in messages %}
        <div class="flash-toast flash-toast-{{ 'danger' if category == 'danger' else 'success' if category == 'success' else 'info' }}">
            {% if category == 'danger' %}
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {% else %}
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;flex-shrink:0;"><polyline points="20 6 9 17 4 12"/></svg>
            {% endif %}
            <span>{{ message }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}
{% endwith %}
